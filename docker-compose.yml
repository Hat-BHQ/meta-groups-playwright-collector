services:
  facebook-groups-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facebook-groups-collector
    restart: unless-stopped
    init: true
    ipc: host
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
